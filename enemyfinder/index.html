<script>(function(){
  function renderAd(el){
    var list;try{list=JSON.parse(el.getAttribute("data-ad"));}catch(e){return;}
    if(!list||!list.length)return;
    var cw=el.clientWidth||(el.parentNode&&el.parentNode.clientWidth)||300;
    list=list.slice().sort(function(a,b){return b.w-a.w;});
    var pick=null,i;for(i=0;i<list.length;i++){if(list[i].w<=cw){pick=list[i];break;}}
    if(!pick)pick=list[list.length-1];
    var scale=Math.min(1,cw/pick.w);
    if(el._w===pick.w&&Math.abs((el._s||0)-scale)<0.01)return;
    el._w=pick.w;el._s=scale;
    el.style.height=Math.round(pick.h*scale)+"px";
    el.innerHTML='<iframe loading="lazy" frameborder="0" scrolling="no" src="'+pick.src+'" width="'+pick.w+'" height="'+pick.h+'" style="position:absolute;left:50%;top:0;transform:translateX(-50%) scale('+scale+');transform-origin:top center;border:0"></iframe>';
  }
  function renderAll(){[].slice.call(document.querySelectorAll(".ef-ad")).forEach(renderAd);}
  if(document.readyState==="complete")renderAll();else window.addEventListener("load",renderAll);
  var t;window.addEventListener("resize",function(){clearTimeout(t);t=setTimeout(renderAll,160);},{passive:true});
  var bottom=document.getElementById("efAdBottom"),close=document.getElementById("efAdClose");
  function syncBottom(){var on=window.matchMedia("(max-width:1119px)").matches&&bottom&&!bottom.classList.contains("closed");document.body.classList.toggle("ef-has-bottom",!!on);}
  syncBottom();window.addEventListener("resize",syncBottom,{passive:true});
  if(close)close.addEventListener("click",function(){bottom.classList.add("closed");document.body.classList.remove("ef-has-bottom");});
})();</script>
