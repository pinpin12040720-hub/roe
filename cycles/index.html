<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星慾姬絆 週期表</title>
<meta name="description" content="星慾姬絆（Stellar Affinity）巡獵與活動的開放週期整理。">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ED-CHROME -->
<div class="ed-topbar">
  <div class="ed-games">GAME：<a href="../">慾神幻想</a>⇄<a href="../enemyfinder/">愛慾轉生</a>⇄<span class="cur">星慾姬絆</span></div>
  <nav class="ed-tools">
    <a href="../sa/">攻略 Wiki</a>
    <a href="./" class="cur">週期表</a>
  </nav>
</div>

<main class="cy-wrap">
  <header class="cy-head">
    <h1>週期表 <span class="tag">星慾姬絆</span></h1>
    <p class="sub">巡獵與活動的開放週期整理。「下次開放」依開放星期與時間即時推算。</p>
  </header>

  <section class="bar">
    <input type="search" id="q" placeholder="搜尋名稱／備註／留言…">
    <select id="filter-cat"><option value="">全部分類</option></select>
    <label class="chk"><input type="checkbox" id="show-archived"> 顯示已封存</label>
    <span class="spacer"></span>
    <button id="btn-new" class="btn primary" hidden>＋ 新增項目</button>
    <div class="menu-wrap" id="admin-wrap" hidden>
      <button id="btn-more" class="btn">資料 ▾</button>
      <div id="more-menu" class="menu" hidden>
        <button data-act="export"><b>匯出 cycles.json</b><small>覆蓋 data/cycles.json 再 commit，才會更新站上內容</small></button>
        <button data-act="copy">複製 JSON 到剪貼簿</button>
        <button data-act="import">匯入 JSON 檔…</button>
        <hr>
        <button data-act="reload">捨棄草稿，重讀站上版本</button>
        <button data-act="logout">登出管理員</button>
      </div>
    </div>
    <button id="btn-login" class="btn">管理員</button>
  </section>

  <p id="draft" class="draft" hidden></p>
  <p id="status" class="status" hidden></p>
  <div id="list" class="cards"></div>
  <p id="empty" class="empty" hidden>沒有符合條件的項目。</p>

  <p class="credit">星期以 1=週一 … 7=週日 表示。「下次開放」為推算值，實際以遊戲內為準。</p>
</main>

<!-- 編輯視窗（僅管理員） -->
<dialog id="dlg" class="dlg">
  <form method="dialog" id="form">
    <h2 id="dlg-title">新增項目</h2>
    <div class="fields">
      <label class="wide">名稱<input type="text" id="f-name" required maxlength="60"></label>
      <label>分類<input type="text" id="f-category" list="cat-list" maxlength="20" placeholder="分類名稱"></label>
      <datalist id="cat-list"></datalist>
      <label>開放時間<input type="time" id="f-openTime"></label>
      <div class="wide">
        <span class="lb">開放星期（可複選）</span>
        <div class="wd" id="f-weekdays"></div>
      </div>
      <label>持續天數<input type="number" id="f-durationDays" min="0" max="365" step="1"></label>
      <label>持續時數<input type="number" id="f-durationHours" min="0" max="23" step="1"></label>
      <label>最近一次開放<input type="date" id="f-lastSeen"></label>
      <label class="chk-field"><input type="checkbox" id="f-archived"> 封存（不再追蹤）</label>
      <label class="wide">備註<textarea id="f-note" rows="2" maxlength="500"></textarea></label>
      <label class="wide">原始筆記<input type="text" id="f-raw" maxlength="200" placeholder="保留手寫原文，方便日後校正"></label>
    </div>
    <div class="dlg-btns">
      <button value="cancel" class="btn" formnovalidate>取消</button>
      <button value="save" id="btn-save" class="btn primary">儲存</button>
    </div>
  </form>
</dialog>

<!-- 管理員登入 -->
<dialog id="login" class="dlg login-dlg">
  <form id="login-form">
    <h2>管理員登入</h2>
    <p class="login-msg" id="login-msg">登入後才會出現編輯功能。改完要匯出 JSON 並 commit，站上內容才會跟著變。</p>
    <label class="gate-f">密碼<input type="password" id="login-pw" autocomplete="current-password" required></label>
    <p class="gate-err" id="login-err" hidden></p>
    <div class="dlg-btns">
      <button type="button" class="btn" id="login-cancel">取消</button>
      <button type="submit" class="btn primary" id="login-btn">登入</button>
    </div>
  </form>
</dialog>

<input type="file" id="file-input" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
