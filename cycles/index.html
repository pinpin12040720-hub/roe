<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週期登錄表</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 解鎖／設定密碼畫面：解鎖前不會有任何內容被寫進 DOM -->
<div id="gate" class="gate">
  <form class="gate-box" id="gate-form">
    <h1>週期登錄表</h1>
    <p class="gate-msg" id="gate-msg">內容已加密，請輸入密碼解鎖。</p>
    <label class="gate-f">密碼<input type="password" id="gate-pw" autocomplete="current-password" required></label>
    <label class="gate-f" id="gate-f2" hidden>再輸入一次<input type="password" id="gate-pw2" autocomplete="new-password"></label>
    <label class="chk"><input type="checkbox" id="gate-remember" checked> 這個分頁內記住（關掉分頁就忘記）</label>
    <div class="gate-btns">
      <button type="button" class="btn" id="gate-cancel" hidden>取消</button>
      <button class="btn primary" id="gate-btn">解鎖</button>
    </div>
    <p class="gate-err" id="gate-err" hidden></p>
    <p class="gate-hint" id="gate-hint"></p>
  </form>
</div>

<div id="app" hidden>
<!-- ED-CHROME -->
<div class="ed-topbar">
  <div class="ed-games">GAME：<a href="../">慾神幻想</a>⇄<a href="../erodex/">愛慾轉生</a>⇄<span class="cur">星慾姬絆</span></div>
  <nav class="ed-tools">
    <a href="../sa/">星慾姬絆 Wiki</a>
    <a href="./" class="cur">週期登錄表</a>
  </nav>
</div>

<main class="cy-wrap">
  <header class="cy-head">
    <h1>週期登錄表 <span class="tag">個人紀錄</span></h1>
    <p class="sub">開放週期與觀察紀錄。內容一律加密後才落地：本機修改存在瀏覽器（密文），要更新站上內容請用「資料 → 匯出加密檔」覆蓋 <code>data/cycles.enc</code> 再 commit。</p>
  </header>

  <section class="bar">
    <input type="search" id="q" placeholder="搜尋名稱／備註／留言…">
    <select id="filter-cat"><option value="">全部分類</option></select>
    <label class="chk"><input type="checkbox" id="show-archived"> 顯示已封存</label>
    <span class="spacer"></span>
    <button id="btn-new" class="btn primary">＋ 新增項目</button>
    <div class="menu-wrap">
      <button id="btn-more" class="btn">資料 ▾</button>
      <div id="more-menu" class="menu" hidden>
        <button data-act="seal"><b>匯出加密檔 cycles.enc</b><small>放進 data/ 再 commit，即可更新站上內容</small></button>
        <button data-act="passwd">變更密碼…</button>
        <button data-act="lock">立刻鎖定</button>
        <hr>
        <button data-act="export">匯出明文 JSON（備份用）</button>
        <button data-act="copy">複製明文 JSON 到剪貼簿</button>
        <button data-act="import">匯入明文 JSON 檔…</button>
        <button data-act="reload" class="danger">捨棄本機修改，重讀站上版本</button>
      </div>
    </div>
  </section>

  <p id="status" class="status" hidden></p>
  <div id="list" class="cards"></div>
  <p id="empty" class="empty" hidden>沒有符合條件的項目。</p>

  <p class="credit">星期以 1=週一 … 7=週日 表示。「下次開放」由開放星期＋時間推算，僅供估計，實際以遊戲內為準。<br>
  資料以 AES-GCM 加密後才離開這個頁面；忘記密碼沒有救回的辦法。</p>
</main>
</div>

<!-- 編輯視窗 -->
<dialog id="dlg" class="dlg">
  <form method="dialog" id="form">
    <h2 id="dlg-title">新增項目</h2>
    <div class="fields">
      <label class="wide">名稱<input type="text" id="f-name" required maxlength="60"></label>
      <label>分類<input type="text" id="f-category" list="cat-list" maxlength="20" placeholder="分類名稱"></label>
      <datalist id="cat-list"></datalist>
      <label>開放時間<input type="time" id="f-openTime"></label>
      <div class="wide">
        <span class="lb">開放星期（可複選）</span>
        <div class="wd" id="f-weekdays"></div>
      </div>
      <label>持續天數<input type="number" id="f-durationDays" min="0" max="365" step="1"></label>
      <label>持續時數<input type="number" id="f-durationHours" min="0" max="23" step="1"></label>
      <label>最近一次開放<input type="date" id="f-lastSeen"></label>
      <label class="chk-field"><input type="checkbox" id="f-archived"> 封存（不再追蹤）</label>
      <label class="wide">備註<textarea id="f-note" rows="2" maxlength="500"></textarea></label>
      <label class="wide">原始筆記<input type="text" id="f-raw" maxlength="200" placeholder="保留手寫原文，方便日後校正"></label>
    </div>
    <div class="dlg-btns">
      <button value="cancel" class="btn" formnovalidate>取消</button>
      <button value="save" id="btn-save" class="btn primary">儲存</button>
    </div>
  </form>
</dialog>

<input type="file" id="file-input" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
