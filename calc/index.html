<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愛慾轉生 傷害計算器</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ED-CHROME -->
<div class="ed-topbar">
  <div class="ed-games">GAME：<a href="../">慾神幻想</a>⇄<span class="cur">愛慾轉生</span>⇄<a href="../sa/">星慾姬絆</a>⇄<a href="../majo/">魔女之夜</a></div>
  <nav class="ed-tools">
    <a href="../enemyfinder/">收集冊</a>
    <a href="../erodex/">角色圖鑑</a>
    <a href="../tierlist/">Tier 表</a>
    <a href="../enemies/">敵人圖鑑</a>
    <a href="../calc/" class="cur">傷害計算</a>
    <a href="../puzzle/">接龍攻略</a>
  </nav>
</div>

<main class="calc-wrap">
  <h1>傷害計算器 <span class="tag">估算</span></h1>
  <p class="sub">資料取自 freesol.cc 的角色／技能數值。傷害公式為社群估算、非官方，參數皆可自行調整；實際數值以遊戲內為準。</p>

  <div class="calc-grid">
    <section class="panel">
      <h2>1. 選角色</h2>
      <input type="text" id="char-search" placeholder="以名稱搜尋…">
      <div id="char-list" class="char-list"></div>
    </section>

    <section class="panel">
      <h2>2. 參數</h2>
      <div id="picked" class="picked">尚未選擇角色</div>
      <div class="fields">
        <label>ATK（可覆寫）<input type="number" id="p-atk" step="1"></label>
        <label>ATK 增益 %<input type="number" id="p-atkbuff" value="0" step="1"></label>
        <label>暴擊率 %<input type="number" id="p-cri" step="0.1"></label>
        <label>暴擊傷害 %（總倍率）<input type="number" id="p-cridmg" step="1"></label>
        <label>敵方 DEF<input type="number" id="p-def" value="500" step="1"></label>
        <label>減傷常數 K<input type="number" id="p-k" value="1000" step="50"></label>
        <label>屬性關係
          <select id="p-elem">
            <option value="1">普通 ×1.0</option>
            <option value="1.3">克制 ×1.3</option>
            <option value="0.7">被克 ×0.7</option>
          </select>
        </label>
      </div>
      <div class="formula" id="formula"></div>
    </section>

    <section class="panel wide">
      <h2>3. 技能傷害</h2>
      <div id="skill-out" class="skill-out"><div class="muted">選擇角色後顯示其攻擊技能的估算傷害。</div></div>
    </section>
  </div>
  <p class="credit">資料來源：<a href="https://freesol.cc/" target="_blank" rel="noopener">freesol.cc</a>（角色／技能數值屬 EROLABS / 開發商）。</p>
</main>
<script src="app.js"></script>
<script src="../assets/report.js" defer></script>
</body>
</html>
