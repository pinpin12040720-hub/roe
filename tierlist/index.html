  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header>
    <a href="/" class="home-link">Freesol</a>
    <h1>Tierlist Maker</h1>
    <div class="header-actions">
      <button id="export-btn" class="header-btn">Export PNG</button>
      <button id="reset-btn" class="header-btn">Reset</button>
    </div>
  </header>

  <main>
    <div id="tierlist-capture" class="tierlist">
      <!-- Tier rows generated by JS -->
    </div>

    <div class="tierlist-controls">
      <div id="color-controls" class="color-controls"></div>
      <button id="add-row-btn" type="button" class="add-row-btn">+ Add row</button>
    </div>

    <p class="hint">Drag into tiers, or click to select then click a tier. Double-click to remove from tier. Click the label to rename a row.</p>

    <div class="pool-section">
      <div class="pool-header">
        <span class="pool-label">Characters</span>
        <div class="pool-filters">
          <select id="filter-rarity">
            <option value="all">Rarity</option>
            <option value="4">SSR+</option>
            <option value="3">SSR</option>
            <option value="2">SR</option>
            <option value="1">R</option>
          </select>
          <select id="filter-element">
            <option value="all">Element</option>
            <option value="Fire">Fire</option>
            <option value="Water">Water</option>
            <option value="Wind">Wind</option>
            <option value="Light">Light</option>
            <option value="Dark">Dark</option>
          </select>
          <select id="filter-class">
            <option value="all">Class</option>
            <option value="Fighter">Fighter</option>
            <option value="Defender">Defender</option>
            <option value="Assassin">Assassin</option>
            <option value="Supporter">Supporter</option>
            <option value="Healer">Healer</option>
          </select>
          <input type="text" id="pool-search" placeholder="Search...">
        </div>
      </div>
      <div id="pool" class="pool"></div>
    </div>
  </main>

  <script src="app.js?v=721b656b"></script>


<!-- ED-I18N:BEGIN --><script>window.ED_I18N={"All":"全部","Fire":"火","Water":"水","Wind":"風","Light":"光","Dark":"暗","Fighter":"鬥士","Defender":"防禦","Supporter":"輔助","Assassin":"刺客","Healer":"治療","Buff Tags":"增益標籤","Debuff Tags":"減益標籤","Sort":"排序","Name":"名稱","Element":"元素","Class":"職業","Rarity":"稀有度","ID":"編號","Rarity ID":"稀有度編號","Apply":"套用","Export All":"全部匯出","Search by name...":"以名稱搜尋…","No characters match your filters.":"沒有符合條件的角色。","Characters":"角色","Close":"關閉","Base Stats":"基礎數值","Skill":"技能","Skills":"技能","Special":"特殊","Passive":"被動","Gauge Skill":"充能技能","No spine config":"無動畫設定","Spine runtime not loaded":"動畫元件未載入","Targeting":"目標","Pick Up":"限定 UP","Limited":"限定","Seasonal":"季節限定","Event":"活動","Raid":"討伐","Trial":"試煉","Hidden Piece":"隱藏","Punishment":"懲罰","ATK Buff":"攻擊增益","ATK Debuff":"攻擊減益","Attack Buff":"攻擊增益","DEF Buff":"防禦增益","DEF Debuff":"防禦減益","HP Buff":"生命增益","Crit Chance":"暴擊率","Crit DMG":"暴擊傷害","CRIT Rate Buff":"暴擊率增益","CRIT DMG Buff":"暴擊傷害增益","Accuracy":"命中","Accuracy Debuff":"命中減益","Evasion":"閃避","Evasion Debuff":"閃避減益","Heal":"治療","Heal Over Time":"持續治療","Self Heal":"自我治療","Unhealable":"無法治療","Shield":"護盾","Shield Remove":"移除護盾","Crowd Control Shield":"控制免疫護盾","Buff Remove":"移除增益","Cleanse":"淨化","Stun":"暈眩","Freeze":"凍結","Burn":"燃燒","Poison":"中毒","Bleed":"流血","Charm":"魅惑","Taunt":"嘲諷","Escape":"逃脫","Resurrect":"復活","Resurrection Ban":"禁止復活","Gauge Recovery":"充能回復","Gauge Reduce":"充能減少","PassiveBuff":"被動增益","Export PNG":"匯出 PNG","Reset":"重置","+ Add row":"＋ 新增列","Add row":"新增列","Top":"上","Middle":"中","Bottom":"下","Remove row (portraits return to pool)":"移除此列（頭像返回待選區）","Drag into tiers, or click to select then click a tier. Double-click to remove from tier. Click the label to rename a row.":"拖曳頭像到階級，或先點選頭像再點階級。雙擊可從階級移除。點左側標籤可重新命名。","Tierlist Maker":"Tier 表製作器","Enemies":"敵人圖鑑"};(function(){var M=window.ED_I18N;
function tw(root){try{var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);var n,arr=[];while(n=w.nextNode())arr.push(n);
 arr.forEach(function(t){var k=t.nodeValue.trim();if(k&&M[k]!=null&&t.nodeValue.indexOf(M[k])<0){t.nodeValue=t.nodeValue.replace(k,M[k]);}});}catch(e){}}
function attrs(root){try{root.querySelectorAll('[placeholder]').forEach(function(el){var k=(el.getAttribute('placeholder')||'').trim();if(M[k])el.setAttribute('placeholder',M[k]);});
 root.querySelectorAll('[title]').forEach(function(el){var k=(el.getAttribute('title')||'').trim();if(M[k])el.setAttribute('title',M[k]);});
 root.querySelectorAll('[aria-label]').forEach(function(el){var k=(el.getAttribute('aria-label')||'').trim();if(M[k])el.setAttribute('aria-label',M[k]);});}catch(e){}}
function run(root){tw(root);attrs(root);}
function boot(){run(document.body);
 var mo=new MutationObserver(function(muts){muts.forEach(function(m){m.addedNodes&&m.addedNodes.forEach(function(nd){if(nd.nodeType===1)run(nd);else if(nd.nodeType===3){var k=nd.nodeValue.trim();if(k&&M[k]!=null)nd.nodeValue=nd.nodeValue.replace(k,M[k]);}});});});
 mo.observe(document.body,{childList:true,subtree:true});}
if(document.readyState!=='loading')boot();else document.addEventListener('DOMContentLoaded',boot);
})();</script><!-- ED-I18N:END -->
