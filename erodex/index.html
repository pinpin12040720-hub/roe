<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>愛慾轉生 角色圖鑑</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- display=optional: never swap fonts after first paint. Avoids the small
       layout shift (the banner-badge moving a pixel or two) caused by font-swap
       reflowing the modal a beat after it opened. -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=DM+Sans:wght@400;500&display=optional" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=721b656b">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js" as="script">
<meta name="asset-version" content="721b656b"></head>
<body>
<!-- ED-CHROME:BEGIN --><style id="ed-chrome-css">
.ed-topbar{position:sticky;top:0;z-index:60;background:rgba(20,12,28,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid rgba(255,255,255,.1);padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-family:"Outfit",system-ui,"Microsoft JhengHei",sans-serif}
.ed-games{font-size:13px;font-weight:800;color:#cdb4e0;display:flex;align-items:center;gap:8px}
.ed-games a{color:#e79cc9;text-decoration:none;padding:2px 8px;border-radius:8px;border:1px solid transparent}
.ed-games a:hover{border-color:#e79cc9}
.ed-games .cur{color:#fff;background:linear-gradient(120deg,#c23b8a,#7a4ec2);padding:2px 10px;border-radius:8px}
.ed-tools{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.ed-tools a{font-size:13px;font-weight:700;color:#cdb4e0;text-decoration:none;padding:5px 11px;border-radius:999px;
 border:1px solid rgba(255,255,255,.14);white-space:nowrap;transition:.15s}
.ed-tools a:hover{border-color:#e79cc9;color:#fff}
.ed-tools a.cur{background:linear-gradient(120deg,#c23b8a,#7a4ec2);color:#fff;border-color:transparent}
</style><div class="ed-topbar"><div class="ed-games">GAME：<a href="../">慾神幻想</a>⇄<span class="cur">愛慾轉生</span>⇄<a href="../sa/">星慾姬絆</a>⇄<a href="../majo/">魔女之夜</a></div><nav class="ed-tools"><a href="../enemyfinder/">收集冊</a><a href="../erodex/" class="cur">角色圖鑑</a><a href="../tierlist/">Tier 表</a><a href="../enemies/">敵人圖鑑</a><a href="../calc/">傷害計算</a><a href="../puzzle/">接龍攻略</a></nav></div><script src="../assets/report.js" defer></script><!-- ED-CHROME:END -->



  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header>
    <a href="/" class="home-link">Freesol</a>
    <h1>EroDex</h1>
    <div class="search-wrapper">
      <input type="text" id="search" placeholder="Search by name...">
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <!-- Row 1: Element, Class, Rarity — always visible -->
    <div class="toolbar-row">
      <div class="filter-group compact">
        <div class="filter-pills" id="element-filters">
          <button class="pill active" data-value="all">All</button>
          <button class="pill" data-value="Fire"><img class="el-icon" src="../data/icons/element_1.png" alt="">Fire</button>
          <button class="pill" data-value="Water"><img class="el-icon" src="../data/icons/element_2.png" alt="">Water</button>
          <button class="pill" data-value="Wind"><img class="el-icon" src="../data/icons/element_3.png" alt="">Wind</button>
          <button class="pill" data-value="Light"><img class="el-icon" src="../data/icons/element_4.png" alt="">Light</button>
          <button class="pill" data-value="Dark"><img class="el-icon" src="../data/icons/element_5.png" alt="">Dark</button>
        </div>
      </div>
      <div class="filter-group compact">
        <div class="filter-pills" id="class-filters">
          <button class="pill active" data-value="all">All</button>
          <button class="pill" data-value="Fighter">Fighter</button>
          <button class="pill" data-value="Defender">Defender</button>
          <button class="pill" data-value="Supporter">Supporter</button>
          <button class="pill" data-value="Assassin">Assassin</button>
          <button class="pill" data-value="Healer">Healer</button>
        </div>
      </div>
      <div class="filter-group compact">
        <div class="filter-pills" id="rarity-filters">
          <button class="pill active" data-value="all">All</button>
          <button class="pill" data-value="1"><span class="rarity-label r">R</span></button>
          <button class="pill" data-value="2"><span class="rarity-label sr">SR</span></button>
          <button class="pill" data-value="3"><span class="rarity-label ssr">SSR</span></button>
          <button class="pill" data-value="4"><span class="rarity-label ssr-plus">SSR+</span></button>
        </div>
      </div>
    </div>

    <!-- Collapsible: Skill Tags -->
    <div class="collapsible">
      <button class="collapsible-toggle" id="toggle-buffs">
        <span>Buff Tags</span>
        <span class="toggle-count" id="buff-count"></span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="collapsible-body hidden" id="buff-tags"></div>
    </div>

    <div class="collapsible">
      <button class="collapsible-toggle" id="toggle-debuffs">
        <span>Debuff Tags</span>
        <span class="toggle-count" id="debuff-count"></span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="collapsible-body hidden" id="debuff-tags"></div>
    </div>

    <!-- Sort -->
    <div class="collapsible">
      <button class="collapsible-toggle" id="toggle-sort">
        <span>Sort</span>
        <span class="toggle-count" id="sort-label">Rarity</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="collapsible-body hidden" id="sort-body">
        <div class="filter-pills" id="sort-options">
          <button class="pill" data-value="name">Name</button>
          <button class="pill" data-value="element">Element</button>
          <button class="pill" data-value="class">Class</button>
          <button class="pill active" data-value="rarity">Rarity</button>
          <button class="pill" data-value="id">ID</button>
        </div>
      </div>
    </div>
  </div>

  <main>
    <div class="results-count" id="results-count"></div>
    <div class="erodex-grid" id="erodex-grid"></div>
    <div class="empty-state hidden" id="empty-state">No characters match your filters.</div>
  </main>

  <div class="detail-overlay hidden" id="detail-overlay">
    <div class="detail-panel" id="detail-panel">
      <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
      <div class="detail-content" id="detail-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-player@4.2/dist/iife/spine-player.js"></script>
  <script src="app.js?v=721b656b"></script>
</body>
</html>
